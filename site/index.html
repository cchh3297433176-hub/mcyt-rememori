<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>忆海 — 独立记忆中枢</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 轻量动态记忆微粒背景画布 -->
  <canvas id="field" aria-hidden="true"></canvas>

  <!-- 顶部原生沉浸导航栏 -->
  <header class="app-header">
    <div class="header-inner">
      <button type="button" class="back-btn" id="btn-back" aria-label="返回小手机桌面">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>桌面</span>
      </button>
      <div class="app-title">
        <span class="title-main">忆海</span>
        <span class="title-sub">Rememori 记忆中枢</span>
      </div>
      <button type="button" class="action-btn" id="btn-open-ingest" aria-label="收纳新记忆">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>收纳</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    
    <!-- 记忆池状态与概览卡片 -->
    <section class="overview-card">
      <div class="stat-grid">
        <div class="stat-item">
          <div class="stat-val" id="stat-total-memories">0</div>
          <div class="stat-lbl">往昔记忆</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-val" id="stat-active-evidence">0</div>
          <div class="stat-lbl">真实凭据</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <div class="stat-val" id="stat-index-state">就绪</div>
          <div class="stat-lbl">引擎状态</div>
        </div>
      </div>
    </section>

    <!-- 追忆检索框 -->
    <section class="search-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-input" type="search" autocomplete="off" placeholder="在记忆之海中追忆（人物、约定、细节）..." />
        <button type="button" id="btn-clear-search" class="clear-btn" aria-label="清空搜索" hidden>×</button>
      </div>
    </section>

    <!-- 角色与身份筛选胶囊条 -->
    <section class="filter-section">
      <div class="filter-capsules" id="filter-capsules">
        <button type="button" class="capsule active" data-filter="all">全量记忆</button>
        <button type="button" class="capsule" data-filter="main">主播大号</button>
        <button type="button" class="capsule" data-filter="alt">小号轨迹</button>
        <!-- 动态由脚本装配角色标签 -->
      </div>
    </section>

    <!-- 记忆列表 -->
    <section class="memory-stream-section">
      <div class="section-meta">
        <span class="meta-title" id="stream-meta-title">记忆列表</span>
        <span class="meta-count" id="stream-meta-count">共 0 条</span>
      </div>

      <div class="memory-list" id="memory-list">
        <!-- 默认空状态 -->
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🌱</div>
          <div class="empty-title">暂无相关往昔记忆</div>
          <div class="empty-desc">聊天中的重要互动与约定会自动沉淀至此，你也可以点击右上角手动收纳。</div>
        </div>
      </div>
    </section>

  </main>

  <!-- 浮层弹窗：真实凭据（证据链）回溯 -->
  <div class="rem-modal-mask" id="evidence-modal" hidden>
    <div class="rem-modal-box">
      <div class="rem-modal-head">
        <div class="rem-modal-title">真实凭据回溯</div>
        <button type="button" class="rem-modal-close" id="btn-close-evidence">×</button>
      </div>
      <div class="rem-modal-body" id="evidence-modal-body">
        <div class="evidence-origin-badge" id="evidence-origin-badge">对话来源</div>
        <div class="evidence-quote-box" id="evidence-quote-box"></div>
        <div class="evidence-meta-row">
          <span class="lbl">记录时刻</span>
          <span class="val" id="evidence-time-val">-</span>
        </div>
        <div class="evidence-meta-row">
          <span class="lbl">关联角色</span>
          <span class="val" id="evidence-npc-val">-</span>
        </div>
      </div>
      <div class="rem-modal-foot">
        <button type="button" class="rem-btn primary" id="btn-confirm-evidence">了解</button>
      </div>
    </div>
  </div>

  <!-- 浮层弹窗：手动收纳记忆 -->
  <div class="rem-modal-mask" id="ingest-modal" hidden>
    <div class="rem-modal-box">
      <div class="rem-modal-head">
        <div class="rem-modal-title">收纳往昔记忆</div>
        <button type="button" class="rem-modal-close" id="btn-close-ingest">×</button>
      </div>
      <div class="rem-modal-body">
        <label class="form-label" for="ingest-text">记忆内容描述</label>
        <textarea id="ingest-text" class="form-textarea" rows="3" placeholder="记录一句深刻的约定、偏好或事实..."></textarea>

        <label class="form-label" for="ingest-tags">关联标签（空格分隔）</label>
        <input id="ingest-tags" type="text" class="form-input" placeholder="例如: 约定 喜好 直播" />

        <div class="form-row">
          <label class="form-label" for="ingest-salience">深刻度: <span id="salience-val-text">0.8</span></label>
          <input id="ingest-salience" type="range" min="0.1" max="1.0" step="0.1" value="0.8" class="form-range" />
        </div>
      </div>
      <div class="rem-modal-foot btn-group">
        <button type="button" class="rem-btn cancel" id="btn-cancel-ingest">取消</button>
        <button type="button" class="rem-btn primary" id="btn-save-ingest">确认收纳</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
